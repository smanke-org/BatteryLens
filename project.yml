# Source of truth for the Xcode project: run `xcodegen generate` after adding files or
# changing settings. BatteryLensKit (Package.swift) holds the logic and its tests.
#
# The app is a Developer ID menu bar app, not sandboxed (it reads IOKit and HID devices).
# The widget extension must be sandboxed (WidgetKit requires it); the two share the
# team-prefixed App Group, which needs no provisioning profile.
name: BatteryLens
options:
  bundleIdPrefix: com.smanke
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BatteryLensKit:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: 32CWL275JJ
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "27"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      # Xcode otherwise adds get-task-allow, which notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  BatteryLens:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # The widget's views, drawn by the app's Debug-only pictures of the widget.
      - path: Widget/RingsView.swift
      - path: Widget/BarsView.swift
      - path: Widget/WidgetShared.swift
    dependencies:
      - package: BatteryLensKit
        product: BatteryLensKit
      - package: BatteryLensKit
        product: BatteryLensShared
      - target: BatteryLensWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.BatteryLens
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BatteryLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  BatteryLensWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: BatteryLensKit
        product: BatteryLensShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smanke.BatteryLens.Widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BatteryLensWidget.entitlements
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
schemes:
  BatteryLens:
    build:
      targets:
        BatteryLens: all
    run:
      config: Debug
    archive:
      config: Release
